      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>
    <!-- Arrow markers -->
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 9 4, 0 8" fill="#94A3B8"/>
    </marker>
  </defs>

