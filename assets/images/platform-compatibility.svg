<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" width="700" height="550">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#EEF2FF;stop-opacity:1"/>
    </linearGradient>
    <!-- Center gradient -->
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1"/>
    </linearGradient>
    <!-- Native support platforms (green) -->
    <linearGradient id="nativeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1"/>
    </linearGradient>
    <!-- Needs conversion platforms (orange) -->
    <linearGradient id="convertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1"/>
    </linearGradient>
    <!-- Needs adapter layer (blue-gray) -->
    <linearGradient id="adapterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64748B;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1"/>
    </linearGradient>
    <!-- Shadow filters -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.14"/>
    </filter>
    <filter id="shadowMd" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1E293B" flood-opacity="0.10"/>
    </filter>
    <!-- Arrow markers -->
    <marker id="arrowNative" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrowConvert" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#F97316"/>
    </marker>
    <marker id="arrowAdapter" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="500" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#1E293B">跨平台适配关系图</text>
  <line x1="140" y1="38" x2="560" y2="38" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ============ Center node: SKILL.md ============ -->
  <!-- Center at (350, 240) -->
  <g filter="url(#shadow)">
    <rect x="286" y="194" width="128" height="92" rx="16" fill="url(#centerGrad)"/>
  </g>
  <!-- File icon in center -->
  <rect x="296" y="204" width="20" height="24" rx="3" fill="white" fill-opacity="0.2"/>
  <line x1="299" y1="212" x2="312" y2="212" stroke="white" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="299" y1="217" x2="312" y2="217" stroke="white" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="299" y1="222" x2="309" y2="222" stroke="white" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="350" y="222" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="800" fill="white">标准</text>
  <text x="350" y="240" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="800" fill="white">SKILL.md</text>
  <text x="350" y="257" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">格式</text>
  <text x="350" y="272" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="rgba(255,255,255,0.7)">统一标准</text>

  <!-- ============ Platform nodes ============ -->
  <!-- 6 platforms arranged radially around center (350, 240) -->
  <!-- Top: Qoder (native, angle=270, pos=(350,90)) -->
  <line x1="350" y1="194" x2="350" y2="138" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowNative)"/>
  <g filter="url(#shadowMd)">
    <rect x="276" y="58" width="148" height="56" rx="12" fill="url(#nativeGrad)"/>
  </g>
  <text x="350" y="82" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="white">Qoder / Qoder Work</text>
  <text x="350" y="100" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="rgba(255,255,255,0.85)">~/.qoder/skills/</text>
  <rect x="286" y="108" width="48" height="14" rx="7" fill="rgba(255,255,255,0.25)"/>
  <text x="310" y="119" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="600" fill="white">原生支持</text>

  <!-- Right: Cursor (convert, angle=0, pos=(570,240)) -->
  <line x1="414" y1="240" x2="492" y2="240" stroke="#F97316" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowConvert)"/>
  <g filter="url(#shadowMd)">
    <rect x="496" y="208" width="148" height="56" rx="12" fill="url(#convertGrad)"/>
  </g>
  <text x="570" y="232" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="white">Cursor</text>
  <text x="570" y="250" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="rgba(255,255,255,0.85)">.cursor/rules/</text>
  <rect x="500" y="258" width="48" height="14" rx="7" fill="rgba(255,255,255,0.25)"/>
  <text x="524" y="269" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="600" fill="white">需转换</text>

  <!-- Lower-right: Windsurf (convert, angle=30, pos=(530,350)) -->
  <line x1="407" y1="276" x2="456" y2="316" stroke="#F97316" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowConvert)"/>
  <g filter="url(#shadowMd)">
    <rect x="460" y="320" width="148" height="56" rx="12" fill="url(#convertGrad)"/>
  </g>
  <text x="534" y="344" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="white">Windsurf</text>
  <text x="534" y="362" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="rgba(255,255,255,0.85)">.windsurf/rules/</text>
  <rect x="464" y="370" width="48" height="14" rx="7" fill="rgba(255,255,255,0.25)"/>
  <text x="488" y="381" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="600" fill="white">需转换</text>

  <!-- Lower-left: Claude Code (convert, pos=(200,375)) -->
  <line x1="300" y1="278" x2="248" y2="322" stroke="#F97316" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowConvert)"/>
  <g filter="url(#shadowMd)">
    <rect x="96" y="320" width="148" height="56" rx="12" fill="url(#convertGrad)"/>
  </g>
  <text x="170" y="344" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="white">Claude Code</text>
  <text x="170" y="362" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="rgba(255,255,255,0.85)">CLAUDE.md / 系统提示</text>
  <rect x="100" y="370" width="48" height="14" rx="7" fill="rgba(255,255,255,0.25)"/>
  <text x="124" y="381" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="600" fill="white">需转换</text>

  <!-- Left: Gemini CLI (convert, pos=(130,240)) -->
  <line x1="286" y1="240" x2="208" y2="240" stroke="#F97316" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowConvert)"/>
  <g filter="url(#shadowMd)">
    <rect x="56" y="208" width="148" height="56" rx="12" fill="url(#convertGrad)"/>
  </g>
  <text x="130" y="232" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="white">Gemini CLI</text>
  <text x="130" y="250" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="rgba(255,255,255,0.85)">GEMINI.md / 系统提示</text>
  <rect x="60" y="258" width="48" height="14" rx="7" fill="rgba(255,255,255,0.25)"/>
  <text x="84" y="269" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="600" fill="white">需转换</text>

  <!-- Upper-left: GitHub Copilot (convert, pos=(130,145)) -->
  <line x1="295" y1="210" x2="210" y2="170" stroke="#F97316" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowConvert)"/>
  <g filter="url(#shadowMd)">
    <rect x="60" y="106" width="148" height="56" rx="12" fill="url(#convertGrad)"/>
  </g>
  <text x="134" y="130" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="white">GitHub Copilot</text>
  <text x="134" y="148" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="rgba(255,255,255,0.85)">.github/copilot-instructions</text>
  <rect x="64" y="156" width="48" height="14" rx="7" fill="rgba(255,255,255,0.25)"/>
  <text x="88" y="167" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="600" fill="white">需转换</text>

  <!-- Bottom-center: MCP-Compatible (adapter, pos=(350,420)) -->
  <line x1="350" y1="286" x2="350" y2="392" stroke="#64748B" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arrowAdapter)"/>
  <g filter="url(#shadowMd)">
    <rect x="276" y="396" width="148" height="56" rx="12" fill="url(#adapterGrad)"/>
  </g>
  <text x="350" y="420" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="white">MCP-Compatible</text>
  <text x="350" y="438" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" fill="rgba(255,255,255,0.85)">需自定义适配层</text>
  <rect x="280" y="446" width="52" height="14" rx="7" fill="rgba(255,255,255,0.25)"/>
  <text x="306" y="457" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="600" fill="white">需适配层</text>

  <!-- ============ Legend ============ -->
  <rect x="50" y="496" width="600" height="40" rx="10" fill="white" fill-opacity="0.65" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Native -->
  <line x1="70" y1="516" x2="94" y2="516" stroke="#059669" stroke-width="2.5"/>
  <polygon points="92,512 100,516 92,520" fill="#059669"/>
  <text x="106" y="520" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#047857" font-weight="600">原生支持</text>
  <text x="158" y="520" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">直接加载</text>
  <!-- Convert -->
  <line x1="250" y1="516" x2="274" y2="516" stroke="#F97316" stroke-width="2.5" stroke-dasharray="5,3"/>
  <polygon points="272,512 280,516 272,520" fill="#F97316"/>
  <text x="286" y="520" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#EA580C" font-weight="600">需转换</text>
  <text x="332" y="520" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">格式适配后使用</text>
  <!-- Adapter -->
  <line x1="460" y1="516" x2="484" y2="516" stroke="#64748B" stroke-width="2.5" stroke-dasharray="3,3"/>
  <polygon points="482,512 490,516 482,520" fill="#64748B"/>
  <text x="496" y="520" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569" font-weight="600">需适配层</text>
  <text x="548" y="520" font-family="system-ui, -apple-system, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#475569">自定义适配</text>
</svg>
